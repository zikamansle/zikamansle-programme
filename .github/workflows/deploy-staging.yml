name: Publier la version de test ZikaMansle
on:
  push:
    branches: [migration/application-autonome]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zikamansle-staging
  cancel-in-progress: false
jobs:
  deploy:
    # Deploy only when explicitly enabled by the repository owner.
    if: ${{ vars.ZIKA_DEPLOY_ENABLED == 'true' }}
    environment: zikamansle-staging
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZIKA_D1_DATABASE_ID: ${{ vars.ZIKA_D1_DATABASE_ID }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Vérifier les paramètres d'accès sans afficher les secrets
        run: |
          if [ -z "$ACCESS_AUD" ]; then echo "ACCESS_AUD absent dans zikamansle-staging"; exit 1; fi
          if [ -z "$ADMIN_EMAIL" ]; then echo "ADMIN_EMAIL absent dans zikamansle-staging"; exit 1; fi
          case "$ACCESS_TEAM_DOMAIN" in
            *.cloudflareaccess.com) ;;
            *) echo "ACCESS_TEAM_DOMAIN absent ou incorrect dans zikamansle-staging"; exit 1 ;;
          esac
          echo "Configuration Access présente ; secrets non affichés."
      - name: Préparer automatiquement les ressources de test
        run: node scripts/github-bootstrap.mjs
      - name: Valider la configuration
        run: node scripts/github-config.mjs
      - run: npm run build
      - name: Appliquer le schéma de test
        run: npx wrangler d1 migrations apply zikamansle-app-staging --remote
      - name: Publier uniquement sur workers.dev
        run: npx wrangler deploy
      - name: Transmettre les secrets sans fichier ni affichage
        run: node scripts/github-secrets.mjs
      - name: Initialiser une seule fois les clés push de test
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Activer les tests push isolés ZikaMansle' }}
        run: node scripts/staging-push-setup.mjs
