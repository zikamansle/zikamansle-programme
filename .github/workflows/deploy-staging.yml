name: Publier la version de test ZikaMansle
on:
  push:
    branches: [migration/application-autonome]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zikamansle-staging
  cancel-in-progress: false
jobs:
  deploy:
    # Temporary one-off staging validation; normal deployments remain disabled.
    if: ${{ vars.ZIKA_DEPLOY_ENABLED == 'true' || (github.event_name == 'push' && github.event.head_commit.message == 'Lancer une seule fois la validation Cloudflare ZikaMansle') }}
    environment: zikamansle-staging
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZIKA_D1_DATABASE_ID: ${{ vars.ZIKA_D1_DATABASE_ID }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
      VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      VAPID_PRIVATE_JWK: ${{ secrets.VAPID_PRIVATE_JWK }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Préparer automatiquement les ressources de test
        run: node scripts/github-bootstrap.mjs
      - name: Valider la configuration
        run: node scripts/github-config.mjs
      - run: npm run build
      - name: Appliquer le schéma de test
        run: npx wrangler d1 migrations apply zikamansle-app-staging --remote
      - name: Publier uniquement sur workers.dev
        run: npx wrangler deploy
      - name: Transmettre les secrets sans fichier ni affichage
        run: node scripts/github-secrets.mjs
