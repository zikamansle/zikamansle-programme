name: Vérifier le correctif de liaison push Android
on:
  push:
    branches: [fix/android-zikateam-push-permission-20261116]
  pull_request:
    branches: [prepare/google-play-android-2026]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-notification-permission-check.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Installer Android 36
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Compiler Android avec la correction de permission
        run: gradle -p android-native :app:assembleDebug --no-daemon
      - name: Vérifier que l'APK existe
        run: test -s android-native/app/build/outputs/apk/debug/app-debug.apk
