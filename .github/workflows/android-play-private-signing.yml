name: Préparer AAB Google Play pour signature privée hors GitHub
on:
  push:
    branches: [prepare/google-play-android-2026]
    paths: ['.github/workflows/android-play-private-signing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Installer Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Ajouter l'icône officielle
        shell: bash
        run: |
          mkdir -p android-native/app/src/release/res/drawable-nodpi
          curl --fail --show-error --location --retry 3 "https://static.wixstatic.com/media/685632_388f80525cec40c2b56e806e82fd6a60~mv2.png" --output android-native/app/src/release/res/drawable-nodpi/zika_icon.png
          file android-native/app/src/release/res/drawable-nodpi/zika_icon.png
      - name: Vérifier configuration Firebase Google Play avant compilation
        shell: bash
        run: |
          grep -Fq "'1:569737641618:android:da9fefbd482d105deff04b'" android-native/app/build.gradle
          grep -Fq "'https://app.zikamansle.fr/api/native/subscribe'" android-native/app/build.gradle
          grep -Fq "versionName '1.0.14'" android-native/app/build.gradle
          test -s android-native/app/src/main/res/raw/zika_notification.m4a
      - name: Compiler AAB release sans clé privée sur GitHub
        run: gradle -p android-native :app:bundleRelease --no-daemon -PzikaLaunchUrl=https://app.zikamansle.fr/
      - name: Exporter AAB pour signature sur poste privé
        uses: actions/upload-artifact@v4
        with:
          name: zikamansle-1.0.14-aab-pour-signature-privee
          path: android-native/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
