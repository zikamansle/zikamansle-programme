name: Vérifier l'intégration native Android ZikaMansle

on:
  push:
    branches: [prepare/google-play-android-2026, fix/android-play-v1015-quality-20261112]
    paths:
      - android-native/**
      - .github/workflows/android-native-fcm-check.yml
  workflow_dispatch:

concurrency:
  group: android-fcm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Installer Android 36
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Compiler l'APK Android Firebase de test (sans publication)
        run: gradle -p android-native :app:assembleDebug --no-daemon
      - name: Vérifier la génération de l'APK
        run: test -s android-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Activer l’accélération KVM de l’émulateur Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Valider le démarrage sur émulateur Android avant livraison
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            set -e
            adb install android-native/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n fr.zikamansle.app.debug/fr.zikamansle.app.ZikaLauncherActivity
            sleep 8
            adb logcat -d -v brief > android-startup-log.txt
            adb shell dumpsys activity activities > android-startup-activity.txt
            adb exec-out screencap -p > android-startup.png
            adb shell pm path fr.zikamansle.app.debug
            python3 android-native/scripts/check_startup.py
      - name: Rendre disponible l'APK Android de test après contrôle
        uses: actions/upload-artifact@v4
        with:
          name: zikamansle-firebase-android-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Conserver le diagnostic Android si le démarrage échoue
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zikamansle-android-diagnostic
          path: |
            android-startup-log.txt
            android-startup-activity.txt
            android-startup.png
          if-no-files-found: ignore
          retention-days: 7
