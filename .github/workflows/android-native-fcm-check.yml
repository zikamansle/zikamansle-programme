name: Vérifier l'intégration native Android ZikaMansle

on:
  push:
    branches: [prepare/google-play-android-2026]
    paths:
      - android-native/**
      - .github/workflows/android-native-fcm-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Installer Android 36
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Compiler l'APK de validation native (sans Firebase et sans publication)
        run: gradle -p android-native :app:assembleDebug --no-daemon
      - name: Vérifier la génération de l'APK
        run: test -s android-native/app/build/outputs/apk/debug/app-debug.apk
