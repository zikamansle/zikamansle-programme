name: Vérifier le secret Firebase du Worker de test

on:
  push:
    branches: [migration/application-autonome]
    paths: [.github/workflows/verify-firebase-secret.yml]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event.head_commit.message == 'Vérifier le secret Firebase staging sans le divulguer' }}
    runs-on: ubuntu-latest
    environment: zikamansle-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Confirmer que Cloudflare possède le secret Firebase sans lire sa valeur
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { secretNames } from './scripts/staging-push-setup.mjs';
          const p=spawnSync(process.execPath,['node_modules/wrangler/bin/wrangler.js','secret','list','--name','zikamansle-app-staging'],{encoding:'utf8',env:process.env});
          if(p.error||p.status!==0)throw Error('Impossible de vérifier les noms de secrets du Worker de test.');
          const names=secretNames(p.stdout);
          if(!names.has('FCM_SERVICE_ACCOUNT_JSON'))throw Error('La clé Firebase serveur manque dans Cloudflare staging.');
          console.log('Firebase serveur présent dans Cloudflare staging (valeur non consultée).');
          NODE
