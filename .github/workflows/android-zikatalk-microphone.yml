name: ZikaTalk Android - compilation de test
on:
  push:
    branches:
      - fix/android-zikatalk-microphone-20261127
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Installer Android 36
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Compiler les variantes
        run: gradle -p android-native :app:assembleDebug :app:bundleRelease --no-daemon
      - name: Vérifier les artefacts et la permission
        run: |
          test -s android-native/app/build/outputs/apk/debug/app-debug.apk
          test -s android-native/app/build/outputs/bundle/release/app-release.aab
          AAPT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0/aapt"
          "$AAPT" dump permissions android-native/app/build/outputs/apk/debug/app-debug.apk | grep android.permission.RECORD_AUDIO
          "$AAPT" dump badging android-native/app/build/outputs/apk/debug/app-debug.apk | grep "versionCode='20'"
      - uses: actions/upload-artifact@v4
        with:
          name: zikamansle-1.0.19-code20-build
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
