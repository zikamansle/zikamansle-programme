name: Build ZikaMansle Android test APK

on:
  workflow_dispatch:
  push:
    branches:
      - prepare/google-play-android-2026

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 16 platform
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare official Zika launcher image for debug APK
        shell: bash
        run: |
          mkdir -p android-native/app/src/debug/res/drawable-nodpi
          curl --fail --show-error --location --retry 3 \
            "https://static.wixstatic.com/media/685632_388f80525cec40c2b56e806e82fd6a60~mv2.png" \
            --output android-native/app/src/debug/res/drawable-nodpi/zika_icon.png
          python3 - <<'PY'
          from pathlib import Path
          path=Path('android-native/app/src/debug/res/drawable-nodpi/zika_icon.png')
          if not path.read_bytes().startswith(bytes.fromhex('89504e470d0a1a0a')):
              raise SystemExit('Official Zika icon could not be verified as PNG')
          PY
      - name: Compile unsigned-debug-test app
        run: gradle -p android-native :app:assembleDebug --no-daemon
      - name: Allow hardware-accelerated Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android launch smoke test (includes ManageDataLauncherActivity)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: |
            set -euo pipefail
            APK=android-native/app/build/outputs/apk/debug/app-debug.apk
            test -s "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -W -n fr.zikamansle.app.debug/fr.zikamansle.app.ZikaLauncherActivity | tee /tmp/zika-launch.txt
            grep -q 'Status: ok' /tmp/zika-launch.txt
            # If the one-time Firebase consent dialog appears, choose "Plus tard"
            # so this startup test never subscribes an emulator to push alerts.
            sleep 5
            adb shell uiautomator dump /sdcard/window.xml >/dev/null || true
            adb shell cat /sdcard/window.xml > /tmp/zika-ui.xml || true
            python3 - <<'PY'
            import re,subprocess
            from pathlib import Path
            ui=Path('/tmp/zika-ui.xml').read_text(errors='replace') if Path('/tmp/zika-ui.xml').exists() else ''
            match=re.search(r'text="Plus tard"[^>]*bounds="\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]"',ui)
            if match:
                x1,y1,x2,y2=map(int,match.groups())
                subprocess.run(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)],check=True)
                print('Notification consent declined for emulator smoke test')
            PY
            sleep 10
            adb logcat -d -v threadtime > /tmp/zika-android-logcat.txt
            if grep -A 25 'FATAL EXCEPTION' /tmp/zika-android-logcat.txt | grep -Eq 'fr[.]zikamansle[.]app|ManageDataLauncherActivity'; then
              echo 'FAIL: ZikaMansle Android crashed during startup'; exit 1
            fi
            if grep -E 'FATAL EXCEPTION|Unable to start activity|ClassNotFoundException' /tmp/zika-android-logcat.txt | grep -Eq 'Zika|ManageDataLauncherActivity'; then
              echo 'FAIL: ZikaMansle component could not start'; exit 1
            fi
            echo 'PASS: Launcher started and no app crash detected on Android API 36'
      - name: Save Android startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zikamansle-android-diagnostics
          path: |
            /tmp/zika-launch.txt
            /tmp/zika-android-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: zikamansle-android-test-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
