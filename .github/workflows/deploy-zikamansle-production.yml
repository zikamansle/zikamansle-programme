name: Préparer le Worker ZikaMansle production (manuel uniquement)
on:
  push:
    branches: [feat/zikateam-fiches-notifications]
    paths:
      - 'wrangler.production.jsonc'
      - 'scripts/zikamansle-production-guard.mjs'
      - '.github/workflows/deploy-zikamansle-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zikamansle-production-preparation
  cancel-in-progress: false
jobs:
  deploy:
    # Une publication explicite est requise pour éviter tout déclenchement accidentel.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[production-worker-deploy-approved]') }}
    runs-on: ubuntu-latest
    # Réutilise uniquement le jeton technique API déjà opérationnel ; les ressources
    # D1/R2 sont distinctes et les clés push seront créées spécifiquement en production.
    environment: zikamansle-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Vérifier les restrictions de production
        run: node scripts/zikamansle-production-guard.mjs
      - name: Vérifier la compilation du Worker de production
        run: npx wrangler deploy --dry-run --outdir dist-production --config wrangler.production.jsonc
      - name: Installer le schéma sur la base de production uniquement
        run: npx wrangler d1 migrations apply zikamansle-app-production --remote --config wrangler.production.jsonc
      - name: Déployer uniquement sur workers.dev (aucun changement DNS)
        run: npx wrangler deploy --keep-vars --config wrangler.production.jsonc
      - name: Vérifier la santé du Worker de production
        run: |
          node --input-type=module -e "const r=await fetch('https://zikamansle-app-production.zikamansle.workers.dev/healthz');const d=await r.json();if(!r.ok||d.app!=='ZikaMansle'||d.environment!=='production')throw Error('Worker production non prêt');console.log('Production isolée prête, aucune bascule DNS.');"
