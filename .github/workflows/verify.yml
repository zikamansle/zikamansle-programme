name: Vérifier l’application
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check public/admin-notifications.js
      - run: npm run build
      - name: Tester en ligne les notifications de test sans envoyer de message
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Vérifier les notifications de test en ligne' }}
        run: node scripts/verify-staging-live.mjs
