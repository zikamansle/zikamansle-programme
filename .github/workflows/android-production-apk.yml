name: ZikaMansle APK Android - domaine officiel

on:
  push:
    branches: [prepare/google-play-android-2026]
    paths:
      - .github/workflows/android-production-apk.yml
      - android-native/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Installer Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Installer la véritable icône officielle de Zika
        shell: bash
        run: |
          mkdir -p android-native/app/src/debug/res/drawable-nodpi
          curl --fail --show-error --location --retry 3 "https://static.wixstatic.com/media/685632_388f80525cec40c2b56e806e82fd6a60~mv2.png" -o android-native/app/src/debug/res/drawable-nodpi/zika_icon.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android-native/app/src/debug/res/drawable-nodpi/zika_icon.png")
          assert p.read_bytes().startswith(bytes.fromhex('89504e470d0a1a0a')), 'Invalid official Zika icon'
          PY
      - name: Construire un APK de test qui ouvre le domaine OFFICIEL
        env:
          # FCM natif Android, strictement sur le même domaine HTTPS officiel.
          ZIKA_NATIVE_REGISTRATION_URL: 'https://app.zikamansle.fr/api/native/subscribe'
        run: gradle -p android-native :app:assembleDebug --no-daemon -PzikaLaunchUrl=https://app.zikamansle.fr/
      - name: Vérifier icône, son et canal Android
        shell: bash
        run: |
          test -s android-native/app/build/outputs/apk/debug/app-debug.apk
          test -s android-native/app/src/main/res/raw/zika_notification.m4a
          grep -F 'festival-zikamansle-alerts-v4' android-native/app/src/main/AndroidManifest.xml
          grep -F '/raw/zika_notification' android-native/app/src/main/java/fr/zikamansle/app/ZikaNotificationChannels.java
          grep -F 'ZIKA_NATIVE_TEAM_LINKED' android-native/app/src/main/java/fr/zikamansle/app/ZikaPushRegistration.java
          grep -F 'app.zikamansle.fr/api/native/subscribe' android-native/app/build/generated/res/resValues/debug/values/gradleResValues.xml
          grep -F 'R.drawable.zika_notification_small' android-native/app/src/main/java/fr/zikamansle/app/ZikaMessagingService.java
          grep -F 'builder.setLargeIcon(largeIcon)' android-native/app/src/main/java/fr/zikamansle/app/ZikaMessagingService.java
      - name: Autoriser l'émulateur accéléré
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tester le démarrage réel de l'APK sur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            set -e
            adb install android-native/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n fr.zikamansle.app.debug/fr.zikamansle.app.ZikaLauncherActivity
            sleep 12
            adb logcat -d -v brief > android-startup-log.txt
            adb shell dumpsys activity activities > android-startup-activity.txt
            adb exec-out screencap -p > android-production-screen.png
            python3 android-native/scripts/check_startup.py
            grep -F 'ZIKA_WEBVIEW_PAGE_FINISHED host=app.zikamansle.fr' android-startup-log.txt
            echo 'PASS: official ZikaMansle mobile website loaded in the Android app'
      - name: Fournir uniquement l'APK ayant passé le contrôle Android
        uses: actions/upload-artifact@v4
        with:
          name: ZikaMansle-1.0.14-Android-Firebase-test
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Conserver diagnostic en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ZikaMansle-android-diagnostic-domaine-officiel
          path: |
            android-startup-log.txt
            android-startup-activity.txt
            android-production-screen.png
          if-no-files-found: ignore
          retention-days: 7
