name: Check live ZikaMansle app origin
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify HTTPS origin, PWA manifest and Android Digital Asset Links
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          urls=[
            'https://app.zikamansle.fr/',
            'https://app.zikamansle.fr/manifest.webmanifest',
            'https://app.zikamansle.fr/.well-known/assetlinks.json'
          ]
          for url in urls:
            req=urllib.request.Request(url,headers={'User-Agent':'ZikaMansle-Android-preflight/1.0'})
            try:
              with urllib.request.urlopen(req, timeout=20) as response:
                data=response.read(4096)
                print(json.dumps({'requested':url,'status':response.status,'final_url':response.url,'content_type':response.headers.get('Content-Type'),'sample':data[:160].decode('utf-8','replace')},ensure_ascii=False))
            except Exception as e:
              print(json.dumps({'requested':url,'error':str(e)},ensure_ascii=False))
          PY
