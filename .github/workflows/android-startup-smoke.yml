name: ZikaMansle Android startup smoke test
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  emulator-startup:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install compile SDK 36
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug app with live mobile origin
        run: gradle -p android-native :app:assembleDebug --no-daemon -PzikaLaunchUrl=https://app.zikamansle.fr/
      - name: Launch on Android emulator and collect diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: |
            set -e
            adb install android-native/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n fr.zikamansle.app.debug/com.google.androidbrowserhelper.trusted.LauncherActivity
            sleep 12
            echo '=== Running app process ==='
            adb shell pidof fr.zikamansle.app.debug || true
            echo '=== Foreground activity ==='
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ActivityRecord' | tail -n 24 || true
            echo '=== Window focus ==='
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' | tail -n 8 || true
            echo '=== App crash and browser log excerpts ==='
            adb logcat -d -v brief | grep -E -i 'FATAL EXCEPTION|AndroidRuntime|TWALauncherActivity|WebViewFallbackActivity|chromium|ZikaMansle|fr.zikamansle' | tail -n 120 || true
            adb exec-out screencap -p > zika_android_startup.png || true
            echo '=== Fatal errors for app ==='
            adb logcat -d -v brief | grep -E -A 10 'FATAL EXCEPTION|Process: fr.zikamansle.app.debug' | tail -n 65 || true
            echo '=== Assert app launcher did not crash ==='
            adb logcat -d -v brief > zika_logcat.txt
            python3 -c "from pathlib import Path; import re; log=Path('zika_logcat.txt').read_text(errors='replace'); bad=bool(re.search(r'FATAL EXCEPTION.{0,450}Process: fr\\.zikamansle\\.app\\.debug',log,re.S)); print('FAIL: ZikaMansle crash' if bad else 'PASS: no ZikaMansle fatal exception'); raise SystemExit(1 if bad else 0)"
            echo '=== Verify app handed off live address to Chrome ==='
            grep -F 'Using url from Manifest: https://app.zikamansle.fr/' zika_logcat.txt
            echo 'PASS: Android startup launched the correct ZikaMansle URL'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zikamansle-android-startup-screen
          path: |
            zika_android_startup.png
            zika_logcat.txt
          if-no-files-found: warn
          retention-days: 7
