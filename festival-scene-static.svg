<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1054 1492" fill="none">
<style>
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite alternate}.delay{animation-delay:-1.4s}.strum{transform-box:fill-box;transform-origin:20% 15%;animation:strum 1s ease-in-out infinite alternate}.note{animation:float 5s ease-out infinite;opacity:0}.n2{animation-delay:1.8s}.n3{animation-delay:3.4s}
@keyframes sway{from{rotate:-2deg}to{rotate:2deg}}@keyframes strum{from{rotate:-5deg}to{rotate:6deg}}@keyframes float{0%{opacity:0;translate:0 8px}15%,65%{opacity:.65}100%{opacity:0;translate:10px -28px}}
.firework .burst{transform-box:fill-box;transform-origin:center;animation:fire-burst 8s linear infinite;animation-delay:var(--delay,0s)}
.firework .ray{stroke-dasharray:none}.firework .spark{opacity:.65}
.firework .trail{stroke-dasharray:90;stroke-dashoffset:90;animation:fire-trail 8s ease-in-out infinite;animation-delay:var(--delay,0s)}
@keyframes fire-burst{0%,10%{opacity:0;scale:.08}15%{opacity:.85;scale:.35}23%{opacity:.8;scale:.8}35%{opacity:.45;scale:1.06}45%,100%{opacity:0;scale:1.2}}
@keyframes fire-trail{0%{stroke-dashoffset:90;opacity:0}8%{opacity:.35}16%{stroke-dashoffset:0;opacity:.5}20%,100%{stroke-dashoffset:0;opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.note{opacity:.45}}
*{animation:none!important}.note{opacity:.5}.firework .burst{opacity:.4;scale:1}.firework .spark{opacity:.4}.firework .trail{opacity:0}</style>
