<style>
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite alternate}.delay{animation-delay:-1.4s}.strum{transform-box:fill-box;transform-origin:20% 15%;animation:strum 1s ease-in-out infinite alternate}.note{animation:float 5s ease-out infinite;opacity:0}.n2{animation-delay:1.8s}.n3{animation-delay:3.4s}
